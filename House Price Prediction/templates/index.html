<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Indian House Price Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        form label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        .result {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Indian House Price Prediction</h1>
        <form action="/predict" method="post">
            <label for="area">Area (in Sq Ft)</label>
            <input type="number" id="area" name="Area" required>

            <label for="bhk">BHK</label>
            <input type="number" id="bhk" name="BHK" required>

            <label for="bathroom">Bathroom</label>
            <input type="number" id="bathroom" name="Bathroom" required>

            <label for="furnishing">Furnishing</label>
            <select id="furnishing" name="Furnishing" required>
                <option value="1">Furnished</option>
                <option value="2">Unfurnished</option>
                <option value="3">Semi-Furnished</option>
            </select>

            <label for="parking">Parking</label>
            <input type="number" id="parking" name="Parking" required>

            <label for="status">Status</label>
            <select id="status" name="Status" required>
                <option value="1">Ready to Move</option>
                <option value="2">Almost Ready</option>
            </select>

            <label for="transaction">Transaction</label>
            <select id="transaction" name="Transaction" required>
                <option value="1">Resale</option>
                <option value="2">New Property</option>
            </select>

            <label for="type">Type</label>
            <select id="type" name="Type" required>
                <option value="1">Builder Floor</option>
                <option value="2">Apartment</option>
            </select>

            <button type="submit">Predict Price</button>
        </form>

        <div class="result">
            <span>Price:</span>
            <span>{{ prediction }}</span>
        </div>

    </div>

    <script>
        document.getElementById('predictForm').addEventListener(onclick, function(event) {
            const area = parseFloat(document.getElementById('area').value);
            const bhk = parseFloat(document.getElementById('bhk').value);
            const bathroom = parseFloat(document.getElementById('bathroom').value);
            const furnishing = parseFloat(document.getElementById('furnishing').value);
            const parking = parseFloat(document.getElementById('parking').value);
            const status = parseFloat(document.getElementById('status').value);
            const transaction = parseFloat(document.getElementById('transaction').value);
            const type = parseFloat(document.getElementById('type').value);

            console.log("Form Data Submitted:");
            console.log("Area:", area);
            console.log("BHK:", bhk);
            console.log("Bathroom:", bathroom);
            console.log("Furnishing:", furnishing);
            console.log("Parking:", parking);
            console.log("Status:", status);
            console.log("Transaction:", transaction);
            console.log("Type:", type);
        });
    </script>

</body>
</html>
